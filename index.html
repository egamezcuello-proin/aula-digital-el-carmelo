<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logo.jpg">
<title>Aula Digital El Carmelo – Prototipo TRL 5</title>
<style>
:root{--p:#12355b;--s:#0b6e70;--a:#f2a900;--bg:#f4f7fa;--t:#1b2530;--c:#fff;--b:#d5dde5;--ok:#1b7f4b;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--t:#e8edf2;--c:#1a232d;--b:#33404e;--p:#7fb2e5}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:#12355b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:1.05rem;margin:0}#net{font-size:.8rem;padding:2px 8px;border-radius:10px;background:var(--ok)}#net.off{background:var(--er)}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0}
h2{font-size:1.15rem;margin:.2rem 0 .5rem;color:var(--p)}h3{font-size:1rem;margin:.3rem 0}
button,.btn{background:var(--s);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:1rem;min-height:44px;cursor:pointer}
button.sec{background:transparent;color:var(--p);border:1px solid var(--p)}button.am{background:var(--a);color:#222}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:1rem;background:var(--c);color:var(--t);margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:6px}
nav button{background:none;color:var(--p);font-size:.85rem;padding:6px 8px}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--s)}
.tag{display:inline-block;color:#fff;border-radius:10px;font-size:.75rem;padding:1px 8px;margin-right:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border:1px solid var(--b);padding:6px;text-align:left}th{background:var(--b)}
.ok{color:var(--ok);font-weight:600}.er{color:var(--er);font-weight:600}small{opacity:.8}
.msg{background:#e6f4ec;color:#14532d;padding:8px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<header><div class="row" style="justify-content:flex-start"><img src="assets/logo.jpg" alt="Escudo de la Institución Educativa El Carmelo" width="40" height="40" style="border-radius:50%"><h1>Aula Digital El Carmelo</h1></div><span id="net">En línea</span></header>
<main id="app" aria-live="polite"></main>
<nav id="nav"></nav>
<script>
"use strict";
const BL={R:["Recordar","#6b7280"],C:["Comprender","#2563eb"],A:["Aplicar","#0b6e70"],N:["Analizar","#7c3aed"],E:["Evaluar","#c2410c"],K:["Crear","#be185d"]};
const USERS={est:{n:"Estudiante Demo",r:"estudiante"},doc:{n:"Docente Demo",r:"docente"},adm:{n:"Administrador Demo",r:"administrador"},dir:{n:"Rectoría Demo",r:"directivo"}};
const CO=[["mat","Matemáticas","Fracciones"],["len","Lenguaje","Comprensión lectora"],["cie","Ciencias Naturales","Ecosistemas"]];
const ACT=(c)=>[["u1","Unidad 1",[[c+"1","R","res","Guía de conceptos (PDF liviano, 1 MB)"],[c+"2","C","res","Video explicativo (8 MB)"],[c+"3","A","quiz","Cuestionario de repaso"]]],["u2","Unidad 2",[[c+"4","N","task","Tarea: analiza un caso de tu entorno"],[c+"5","E","forum","Foro: ¿qué aprendimos?"],[c+"6","K","task","Proyecto: crea tu propio ejemplo"]]]];
const Q={mat:[["¿Cuánto es 3/4 + 1/4?",["1","4/8","3/16"],0],["¿Qué fracción es equivalente a 1/2?",["2/3","2/4","1/3"],1],["¿Cuánto es 1/2 de 10?",["5","2","20"],0]],
len:[["La idea principal de un texto es…",["un detalle","lo más importante que dice","el título solamente"],1],["Un sinónimo de «rápido» es…",["lento","veloz","pesado"],1],["Un texto narrativo cuenta…",["una historia","una receta","una tabla"],0]],
cie:[["Un productor en un ecosistema es…",["un animal","una planta","un hongo"],1],["El Sol aporta al ecosistema…",["energía","rocas","sonido"],0],["Un consumidor se alimenta de…",["otros seres vivos","solo luz","solo agua"],0]]};
const DEF={done:{},grades:{},posts:[{u:"Docente Demo",t:"Bienvenidos. Participen y pregunten."}],tasks:{},dl:{},sus:null,backup:null,visits:0};
let D;try{D=Object.assign({},DEF,JSON.parse(localStorage.getItem("ec")||"{}"))}catch(e){D=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem("ec",JSON.stringify(D))}catch(e){}};
const S={u:null,v:"home",c:null,a:null,m:""};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const all=c=>ACT(c).flatMap(u=>u[2]);
const prog=c=>{const a=all(c);return Math.round(100*a.filter(x=>D.done[x[0]]).length/a.length)};
const tag=k=>`<span class="tag" style="background:${BL[k][1]}">${BL[k][0]}</span>`;
const $=id=>document.getElementById(id);
function go(v,c,a){S.v=v;if(c!==undefined)S.c=c;if(a!==undefined)S.a=a;S.m="";draw()}
function login(){const u=USERS[$("lu").value.trim().toLowerCase()];if(u&&$("lp").value==="1234"){S.u=u;D.visits++;save();go("home")}else{S.m="Usuario o contraseña incorrectos. Verifica e intenta de nuevo.";draw()}}
function out(){S.u=null;go("home")}
function nav(){const r=S.u&&S.u.r;const b=(v,t)=>`<button onclick="go('${v}')">${t}</button>`;
$("nav").innerHTML=!r?"":b("home","Inicio")+(r==="estudiante"?b("grades","Notas")+b("sus","Evaluar app"):"")+(r==="docente"||r==="directivo"?b("rep","Informes"):"")+(r==="administrador"?b("adm","Admin"):"")+`<button onclick="out()">Salir</button>`}
function draw(){nav();const r=S.u&&S.u.r;let h="";
if(!r)h=`<div class="card"><p style="text-align:center;margin:0"><img src="assets/logo.jpg" alt="Escudo de la Institución Educativa El Carmelo" width="110" height="110" style="border-radius:50%"></p><h2>Ingresar</h2><label>Usuario<input id="lu" autocomplete="username" placeholder="est, doc, adm o dir"></label><label>Contraseña<input id="lp" type="password" autocomplete="current-password" placeholder="1234"></label><button onclick="login()">Entrar</button><p class="er">${esc(S.m)}</p><small>Prototipo de demostración: usuarios est, doc, adm, dir; contraseña 1234. Los datos se guardan solo en este dispositivo.</small></div>`;
else if(S.v==="home")h=home(r);else if(S.v==="course")h=course();else if(S.v==="act")h=act();else if(S.v==="grades")h=grades();else if(S.v==="rep")h=rep();else if(S.v==="adm")h=adm();else if(S.v==="sus")h=sus();
$("app").innerHTML=h}
function home(r){let h=`<h2>Hola, ${esc(S.u.n)}</h2><small>Rol: ${r}</small>`;
if(r==="estudiante"||r==="docente")h+=CO.map(c=>`<div class="card"><div class="row"><h3>${c[1]}</h3><button onclick="go('course','${c[0]}')">Abrir</button></div><small>${c[2]}</small><div class="bar" role="progressbar" aria-valuenow="${prog(c[0])}"><i style="width:${prog(c[0])}%"></i></div><small>Avance: ${prog(c[0])} %</small></div>`).join("")+`<div class="card"><h3>Próximas fechas</h3><small>Tarea de Matemáticas: viernes · Foro de Ciencias: lunes</small></div>`;
if(r==="docente")h+=`<div class="card"><h3>Publicar aviso</h3><input id="av" placeholder="Escribe un aviso para el foro"><button class="am" onclick="aviso()">Publicar</button></div>`;
if(r==="administrador")h+=`<div class="card">Gestiona usuarios y copias en la pestaña Admin.</div>`;
if(r==="directivo")h+=`<div class="card">Consulta el uso de la plataforma en Informes.</div>`;
return h+(S.m?`<p class="msg">${esc(S.m)}</p>`:"")}
function aviso(){const t=$("av").value.trim();if(!t)return;D.posts.push({u:S.u.n,t});save();S.m="Aviso publicado en el foro de novedades.";draw()}
function course(){const c=CO.find(x=>x[0]===S.c);return `<button class="sec" onclick="go('home')">← Volver</button><h2>${c[1]}</h2>`+ACT(c[0]).map(u=>`<div class="card"><h3>${u[1]}</h3>`+u[2].map(a=>`<div class="row" style="padding:6px 0"><span>${tag(a[1])}${esc(a[3])} ${D.done[a[0]]?'<span class="ok">✔</span>':""}</span><button class="sec" onclick="go('act',null,'${a[0]}')">Abrir</button></div>`).join("")+`</div>`).join("")}
function find(id){for(const c of CO)for(const a of all(c[0]))if(a[0]===id)return{c:c[0],a}}
function act(){const f=find(S.a),a=f.a,c=f.c;let h=`<button class="sec" onclick="go('course','${c}')">← Volver al curso</button><h2>${tag(a[1])}${esc(a[3])}</h2>`;
if(a[2]==="res"){const d=D.dl[a[0]];h+=`<div class="card"><p>Contenido de demostración. Los recursos descargables se pueden consultar sin conexión continua.</p><button onclick="dl('${a[0]}')">${d?"✔ Descargado":"Descargar para sin conexión"}</button> <button class="am" onclick="done('${a[0]}')">Marcar como completado</button></div>`}
if(a[2]==="quiz"){h+=`<div class="card" id="qz">`+Q[c].map((q,i)=>`<p><b>${i+1}. ${q[0]}</b></p>`+q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" style="width:auto"> ${o}</label><br>`).join("")).join("")+`<button onclick="quiz('${c}','${a[0]}')">Enviar respuestas</button><div id="qr"></div></div>`}
if(a[2]==="task"){const t=D.tasks[a[0]];h+=`<div class="card"><textarea id="tx" rows="4" placeholder="Escribe tu respuesta">${t?esc(t):""}</textarea><button onclick="task('${a[0]}')">Entregar tarea</button></div>`}
if(a[2]==="forum"){h+=`<div class="card">`+D.posts.map(p=>`<p><b>${esc(p.u)}:</b> ${esc(p.t)}</p>`).join("")+`<input id="fp" placeholder="Escribe tu mensaje"><button onclick="post('${a[0]}')">Publicar</button></div>`}
return h+(S.m?`<p class="msg">${esc(S.m)}</p>`:"")}
function dl(id){D.dl[id]=1;save();S.m="Recurso descargado para consulta sin conexión.";draw()}
function done(id){D.done[id]=1;save();S.m="Actividad completada. Tu avance se actualizó.";draw()}
function quiz(c,id){let ok=0;Q[c].forEach((q,i)=>{const s=document.querySelector(`input[name=q${i}]:checked`);if(s&&+s.value===q[2])ok++});const n=Math.round(100*ok/Q[c].length);D.grades[c]=n;D.done[id]=1;save();
$("qr").innerHTML=`<p class="${n>=60?"ok":"er"}">Resultado: ${ok} de ${Q[c].length} correctas (${n} %). ${n>=60?"¡Muy bien! Sigue con la siguiente unidad.":"Repasa la guía de conceptos e inténtalo de nuevo."}</p>`}
function task(id){const t=$("tx").value.trim();if(!t){S.m="Escribe tu respuesta antes de entregar.";draw();return}D.tasks[id]=t;D.done[id]=1;save();S.m="Entrega recibida el "+new Date().toLocaleString("es-CO")+".";draw()}
function post(id){const t=$("fp").value.trim();if(!t)return;D.posts.push({u:S.u.n,t});D.done[id]=1;save();S.m="Mensaje publicado.";draw()}
function grades(){return `<h2>Mis calificaciones</h2><div class="card"><table><tr><th>Área</th><th>Cuestionario</th><th>Avance</th></tr>`+CO.map(c=>`<tr><td>${c[1]}</td><td>${D.grades[c[0]]!==undefined?D.grades[c[0]]+" %":"—"}</td><td>${prog(c[0])} %</td></tr>`).join("")+`</table><small>Solo ves tus propias notas.</small></div>`}
function rep(){const own=CO.map(c=>prog(c[0]));const avg=Math.round(own.reduce((a,b)=>a+b,0)/own.length);const g=Object.values(D.grades);const ng=g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length)+" %":"—";
const sim=[["Est. A",80,85],["Est. B",55,70],["Est. C",30,60]];
return `<h2>Informe de participación</h2><div class="card"><table><tr><th>Estudiante</th><th>Avance</th><th>Nota prom.</th></tr><tr><td>Estudiante Demo (real)</td><td>${avg} %</td><td>${ng}</td></tr>`+sim.map(s=>`<tr><td>${s[0]} (simulado)</td><td>${s[1]} %</td><td>${s[2]} %</td></tr>`).join("")+`</table></div><div class="card"><h3>Uso de la plataforma</h3><p>Ingresos registrados en este dispositivo: <b>${D.visits}</b>. Entregas: <b>${Object.keys(D.tasks).length}</b>. Descargas: <b>${Object.keys(D.dl).length}</b>.</p><small>Los datos simulados se identifican como tales; no corresponden a personas reales.</small></div>`}
function adm(){return `<h2>Administración</h2><div class="card"><table><tr><th>Usuario</th><th>Nombre</th><th>Rol</th></tr>`+Object.entries(USERS).map(u=>`<tr><td>${u[0]}</td><td>${u[1].n}</td><td>${u[1].r}</td></tr>`).join("")+`</table></div><div class="card"><button onclick="bk()">Crear copia de respaldo</button> <button class="sec" onclick="rs()">Restaurar última copia</button><p>Última copia: ${D.backup?new Date(D.backup.at).toLocaleString("es-CO"):"ninguna"}</p>${S.m?`<p class="msg">${esc(S.m)}</p>`:""}</div>`}
function bk(){const c=JSON.parse(JSON.stringify(D));delete c.backup;D.backup={at:Date.now(),d:c};save();S.m="Copia de respaldo creada.";draw()}
function rs(){if(!D.backup){S.m="No hay copias para restaurar.";draw();return}const b=D.backup;D=Object.assign({},DEF,b.d,{backup:b});save();S.m="Copia restaurada correctamente.";draw()}
const SUSQ=["Creo que me gustaría usar esta plataforma con frecuencia.","Encontré la plataforma innecesariamente compleja.","Pensé que la plataforma era fácil de usar.","Creo que necesitaría el apoyo de una persona técnica para usarla.","Las funciones estaban bien integradas.","Hubo demasiada inconsistencia en la plataforma.","La mayoría de las personas aprendería a usarla muy rápido.","La encontré muy incómoda de usar.","Me sentí muy seguro(a) usándola.","Necesité aprender muchas cosas antes de empezar."];
function sus(){return `<h2>Escala de usabilidad (SUS)</h2><div class="card">`+SUSQ.map((q,i)=>`<p>${i+1}. ${q}<br><select id="s${i}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select></p>`).join("")+`<button onclick="susGo()">Calcular puntaje</button><p id="sr">${D.sus!==null?"Último puntaje SUS: <b>"+D.sus+"</b>":""}</p><small>1 = totalmente en desacuerdo, 5 = totalmente de acuerdo.</small></div>`}
function susGo(){let t=0;for(let i=0;i<10;i++){const v=+$("s"+i).value;t+=i%2===0?v-1:5-v}D.sus=t*2.5;save();$("sr").innerHTML=`Puntaje SUS: <b>${D.sus}</b> (meta ≥ 68): <span class="${D.sus>=68?"ok":"er"}">${D.sus>=68?"cumple":"no cumple"}</span>`}
const upd=()=>{const n=$("net");n.textContent=navigator.onLine?"En línea":"Sin conexión";n.className=navigator.onLine?"":"off"};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
addEventListener("online",upd);addEventListener("offline",upd);upd();draw();
</script>
</body>
</html>
